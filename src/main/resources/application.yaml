spring:
  application:
    name: "spring-rest-clean-football-service"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  threads:
    virtual:
      enabled: false
server:
  tomcat:
    max-keep-alive-requests: -1
  http2:
    enabled: true # required for gRPC
  port: 8088

datasources:
  flyway:
    locations: db/migration
  player:
    datasource:
      url: jdbc:postgresql://localhost:5438/postgres
      username: postgres
      password: postgres
      hikari:
        max-lifetime: 600000
        maximum-pool-size: 100 # default: 10
  team:
    datasource:
      url: jdbc:postgresql://localhost:5438/postgres
      username: postgres
      password: postgres
      hikari:
        max-lifetime: 600000
        maximum-pool-size: 100 # default: 10

logging:
  level:
    org.springframework: info

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-components: always
      show-details: always
