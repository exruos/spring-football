spring:
  application:
    name: "spring-rest-clean-football-service"
  threads:
    virtual:
      enabled: false
  datasource:
    url: jdbc:postgresql://postgres-db-clean-service:5438/postgres
    username: postgres
    password: postgres
    hikari:
      max-lifetime: 600000
      maximum-pool-size: 90 # default: 10
  flyway:
    locations: classpath:db/migration
  data:
    jdbc:
      repositories:
        enabled: true
  web:
    error:
      whitelabel:
        enabled: false

server:
  tomcat:
    max-keep-alive-requests: -1
  http2:
    enabled: false # required for gRPC
  port: 8080

logging:
  level:
    org.springframework: info

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-components: always
      show-details: always
