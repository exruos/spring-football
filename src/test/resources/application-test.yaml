spring:
  main:
    allow-bean-definition-overriding: true
  flyway:
    enabled: true
    locations: classpath:test/migration
  sql:
    init:
      mode: never
  data:
    jdbc:
      repositories:
        enabled: true
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 10000
      max-lifetime: 3000
      connection-timeout: 5000
      leak-detection-threshold: 0
      initialization-fail-timeout: -1
      pool-name: TestHikariPool
