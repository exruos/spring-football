---
name: Spring Football service Clean - gRPC (k6)
author: David Kopp
description: Executes a gRPC load test scenario using K6. There are two phases, warm up and constant load. An open workload scenario is used with a peak of 400 requests per second.

compose-file: !include docker/compose.yml

services:

  # change container names so GMT can compare results between simple and clean
  service:
    container_name: service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5438/postgres
      SERVER_HTTP2_ENABLED: true # HTTP/2 is required for gRPC

  db:
    container_name: database

  k6:
    container_name: ghz
    image: registry.gitlab.com/envite-consulting/sustainable-software-architecture/ghz:ghz-0.121.0
    depends_on:
      service:
        condition: service_healthy # wait until the service is ready before starting with the flow
    command: sleep infinity # wait for commands in the flow

flow:
  - name: Warm Up
    container: ghz
    commands:
      - type: console
        command: ghz --config /tmp/repo/client/ghz_player_grpc_gmt_warm_up.json
        log-stdout: true
        log-stderr: true
  - name: Constant Load
    container: ghz
    commands:
      - type: console
        command: ghz --config /tmp/repo/client/ghz_player_grpc_gmt_load.json
        log-stdout: true
        log-stderr: true
