name: spring-clean-football-service

services:

  service:
    container_name: football-kotlin-container
    platform: linux/amd64
    image: localhost:5000/football-spring:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://football-db:5438/postgres
      THC_PATH: /actuator/health
      THC_PORT: 8080
      MATCH_REST_TEAM_NAME_STRATEGY: POJO_WITH_CACHE
      MATCH_REST_TEAM_SERVICE_BASE_URL: http://
      SPRING_FLYWAY_ENABLED: "false"
      # JVM TLS 1.3 optimizations for session caching and resumption
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.sessionCacheSize=10000
        -Djdk.tls.client.enableSessionTicketExtension=true
        -Djdk.tls.server.enableSessionTicketExtension=true
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: "/workspace/health-check"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    container_name: football-db
    platform: linux/amd64
    image: localhost:5000/football-db:postgres-18.4 # use pre-built image with data to save time at startup
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5438:5438"
    command: -p 5438
    healthcheck:
      test: "pg_isready -p 5438 -U postgres"
      start_period: "30s"
      start_interval: "1s"
      interval: "24h" # only the start is relevant for us
