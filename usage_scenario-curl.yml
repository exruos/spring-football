---
name: Spring Football Modulith Clean - REST (curl)
author: David Kopp
description: Executes individual API requests using curl

compose-file: !include docker/compose.yml

services:
  
  # change container names so GMT can compare results between simple and clean
  modulith:
    container_name: modulith
    environment:
      DATASOURCES_FOOTBALL_DATASOURCE_URL: jdbc:postgresql://database:5438/postgres
      SERVER_HTTP2_ENABLED: false

  db:
    container_name: database

  curl:
    container_name: curl
    image: curlimages/curl:8.1.0
    command: sh
    depends_on:
      modulith:
        condition: service_healthy # wait until the modulith is ready before starting with the flow

sci:
  R_d: API Call

flow:
  - name: Get player by id
    container: curl
    commands:
      - type: console
        command: curl -s modulith:8088/players/1
        note: Get player
      - type: console
        command: echo GMT_SCI_R=1
        log-stdout: true
        read-sci-stdout: true

  - name: Get player records by id
    container: curl
    commands:
      - type: console
        command: curl -s modulith:8088/players/record/1
        note: Get player record
      - type: console
        command: echo GMT_SCI_R=1
        log-stdout: true
        read-sci-stdout: true
